settings:
  default_crit_mode: noncrit

global:
  av: 0
  skill_points: 3
  skill_point_cap: 5

units:
  hero:
    name: Hero
    side: ally
    hp: 1000
    max_hp: 1000
    speed: 100
    remaining_av: 100
    stats: {atk: 1000, crit_rate: 0, crit_dmg: 0}
    actions:
      phase_test:
        tags: [attack]
        target_policy: manual
        damage_packets:
          - id: first_hit
            element: quantum
            scaling_stat: atk
            multiplier: 0.06
            can_crit: false
          - id: second_hit
            element: quantum
            scaling_stat: atk
            multiplier: 0.06
            can_crit: false
        effects_after_damage:
          - type: damage_unit
            target: target
            amount: 10
            ignore_shield: true
  phase_enemy:
    name: Phase Enemy
    side: enemy
    hp: 50
    max_hp: 50
    speed: 100
    remaining_av: 100
    stats: {defense: 0}
    res: {quantum: 0}
    hp_model:
      type: phase_hp
      carry_over_damage: false
      bars:
        - hp: 50
        - hp: 50

route:
  - actor: hero
    action: phase_test
    timing: manual
    targets: [phase_enemy]
