      - action.actor_is_ally == true
      - target.is_alive == true or target.invalid_after_damage == true
      - target.hp_percent <= 0.5 or target.invalid_after_damage == true
      - usage_limit.not_used_this_owner_turn == true
    effects:
    - type: launch_action
      action_id: seele_novaflare_auto_skill
      target_policy: original_target_or_lowest_hp_percent_enemy
      queue: immediate_queue
    usage_limit:
      scope: per_owner_turn
      max_times: 1
    reset:
      timing: owner_turn_start
    user_validated:
      technique_can_trigger_this: true
      auto_skill_triggers_skill_spd_buff: true
      auto_skill_does_not_grant_base_energy: true
      auto_skill_kill_energy_is_enabled: true
      auto_skill_can_trigger_resurgence: true
  - id: seele_resurgence_trigger
    owner: seele
    source: character
    timing: after_defeat_enemy
    priority: 90
    condition:
      all:
      - defeated_by.owner == seele
      - action.tags contains can_trigger_resurgence
      - context.extra_turn_type != resurgence
    effects:
    - type: add_buff
      buff_id: seele_amplification
    - type: enqueue_extra_turn
      actor: seele
      extra_turn_type: resurgence
      queue: extra_turn_queue
      restrictions:
        ultimate_allowed_during_extra_turn: false
        extra_turn_consumes_buff_turn_duration: false
        extra_turn_changes_regular_remaining_av: false
    usage_limit:
      scope: action_resolution
      max_times: 1
    user_validated:
      kills_during_resurgence_extra_turn_do_not_trigger_another_resurgence: true
  - id: seele_nightshade_trigger
