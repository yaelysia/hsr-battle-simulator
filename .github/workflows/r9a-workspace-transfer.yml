name: R9A temporary exact-base workspace

on:
  push:
    branches:
      - fix/r9a-create-servant-formal-transport
    paths:
      - .github/workflows/r9a-workspace-transfer.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d60a4305206bc11b67edf445a55478d90c96257
          submodules: recursive
          persist-credentials: false
      - name: Export exact tracked baseline and pinned non-text source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2d60a4305206bc11b67edf445a55478d90c96257
          test "$(git -C turnbasedgamedata-main rev-parse HEAD)" = 14c1d18f91a8101d610e6c523447a7517de3fae1
          mkdir -p "$RUNNER_TEMP/r9a-source"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/r9a-source/source.tar.gz"
          git -C turnbasedgamedata-main archive --format=tar HEAD Config ExcelOutput Stages Story README.md | gzip > "$RUNNER_TEMP/r9a-source/pinned-nontext-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/r9a-source/base_head.txt"
          git -C turnbasedgamedata-main rev-parse HEAD > "$RUNNER_TEMP/r9a-source/tbgd_pin.txt"
          du -h "$RUNNER_TEMP/r9a-source/"*
          test "$(du -sk "$RUNNER_TEMP/r9a-source" | cut -f1)" -lt 131072
          sha256sum "$RUNNER_TEMP/r9a-source/"*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: r9a-exact-base-and-pinned-source
          path: ${{ runner.temp }}/r9a-source/
          retention-days: 1
