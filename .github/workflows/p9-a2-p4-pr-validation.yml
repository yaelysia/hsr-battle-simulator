name: P9 A2 P4 direct validation

on:
  pull_request:
    paths:
      - ".github/workflows/p9-a2-p4-pr-validation.yml"
      - "hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tbgd/coverage.py"
      - "hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tbgd/lowering.py"
      - "hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_a2_p4_set_entity_visible_process_only_retirement.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p4-direct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head and pinned TBGD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Verify TBGD pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C turnbasedgamedata-main rev-parse HEAD)" = "14c1d18f91a8101d610e6c523447a7517de3fae1"

      - name: Preflight P4 validator compatibility and targeted baseline probe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_a2_p4_set_entity_visible_process_only_retirement.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  """    _accepted_context,\n    _build_context,\n    _definitions,\n    _state_for_admission,\n""",
                  """    _accepted_context,\n    build_context as _build_context,\n    definitions as _definitions,\n    _state_for_admission,\n""",
              ),
              (
                  """            projection = _formal_action_task_graph_projection(\n                rules,\n                definition.action_id,\n                definition.level,\n                tasks,\n            )\n            accepted = _accepted_context(\n""",
                  """            projection = _formal_action_task_graph_projection(\n                rules,\n                definition.action_id,\n                definition.level,\n                tasks,\n            )\n            if not any(\n                task.task_id in projection.reachable_task_ids\n                and _family_for_task(task) == FAMILY\n                for task in tasks\n            ):\n                continue\n            accepted = _accepted_context(\n""",
              ),
              (
                  "def probe(root: Path, *, target: Mapping[str, Any] | None = None) -> dict[str, Any]:",
                  "def probe(\n    root: Path,\n    *,\n    target: Mapping[str, Any] | None = None,\n    require_set_blocker: bool = False,\n) -> dict[str, Any]:",
              ),
              (
                  "            require_set_blocker=target is None,",
                  "            require_set_blocker=require_set_blocker,",
              ),
              (
                  "def baseline_probe(root: Path) -> dict[str, Any]:",
                  "def baseline_probe(root: Path, target: Mapping[str, Any]) -> dict[str, Any]:",
              ),
              (
                  """                    "--tbgd-root",\n                    str(root),\n                ],\n""",
                  """                    "--tbgd-root",\n                    str(root),\n                    "--definition-id",\n                    str(target["definition_id"]),\n                    "--action-id",\n                    str(target["action_id"]),\n                    "--action-level",\n                    str(target["action_level"]),\n                    "--require-set-blocker",\n                ],\n""",
              ),
              (
                  """    baseline = baseline_probe(root)\n    target = {\n        key: baseline["representative"][key]\n        for key in ("definition_id", "action_id", "action_level")\n    }\n    current = probe(root, target=target)\n""",
                  """    current = probe(root)\n    target = {\n        key: current["representative"][key]\n        for key in ("definition_id", "action_id", "action_level")\n    }\n    baseline = baseline_probe(root, target)\n""",
              ),
              (
                  """    parser.add_argument("--tbgd-root", type=Path, default=TBGD)\n    args = parser.parse_args()\n    root = args.tbgd_root.resolve()\n    if args.probe_json:\n        print(json.dumps(probe(root), ensure_ascii=False, sort_keys=True))\n        return 0\n""",
                  """    parser.add_argument("--tbgd-root", type=Path, default=TBGD)\n    parser.add_argument("--definition-id")\n    parser.add_argument("--action-id")\n    parser.add_argument("--action-level", type=int)\n    parser.add_argument("--require-set-blocker", action="store_true")\n    args = parser.parse_args()\n    root = args.tbgd_root.resolve()\n    target = None\n    target_fields = (args.definition_id, args.action_id, args.action_level)\n    if any(value is not None for value in target_fields):\n        if args.definition_id is None or args.action_id is None or args.action_level is None:\n            fail("probe_target_identity_incomplete")\n        target = {\n            "definition_id": args.definition_id,\n            "action_id": args.action_id,\n            "action_level": args.action_level,\n        }\n    if args.probe_json:\n        print(\n            json.dumps(\n                probe(\n                    root,\n                    target=target,\n                    require_set_blocker=args.require_set_blocker,\n                ),\n                ensure_ascii=False,\n                sort_keys=True,\n            )\n        )\n        return 0\n""",
              ),
          ]
          for old, new in replacements:
              assert text.count(old) == 1, f"P4 validator patch point drifted: {old[:80]!r}"
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_a2_p4_set_entity_visible_process_only_retirement.py

      - name: Run P4 SetEntityVisible Direct
        shell: bash
        run: |
          set -euo pipefail
          python hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_a2_p4_set_entity_visible_process_only_retirement.py --direct
