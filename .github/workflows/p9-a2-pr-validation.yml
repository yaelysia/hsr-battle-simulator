name: P9 A2 PR Validation

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/core/executor.py'
      - 'hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/systems/event_dispatch.py'
      - 'hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/systems/status_callbacks.py'
      - 'hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/systems/ability.py'
      - 'hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_a2_action_window_status_nested_ability_transport.py'
      - 'hsr_v075_baseline_clean/hsr/live_validation_reports/P9-A2_ACTION_WINDOW_STATUS_NESTED_ABILITY_TRANSPORT_execution_report.md'
      - 'hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/docs/p9_execution_cards/P9-A2_ACTION_WINDOW_STATUS_NESTED_ABILITY_TRANSPORT.md'
      - '.github/workflows/p9-a2-pr-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head and source submodule
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Apply exact validator diagnostic patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_a2_action_window_status_nested_ability_transport.py')
          text = path.read_text(encoding='utf-8')
          replacements = (
              (
                  'from ..rules.rulebook import RuleBook\n',
                  'from ..rules.engine_rule_registry import build_engine_rule_registry\nfrom ..rules.ir import CanonicalIR, build_external_task_topology_dependency_ledger\nfrom ..rules.rulebook import RuleBook\n',
              ),
              (
                  'from ..tbgd.lowering import TBGDLowering\n',
                  'from ..tbgd.lowering import TBGDLowering, _lower_status_event_families\nfrom ..tbgd.task_graph_materializer import materialize_character_runtime_task_graph_catalog\n',
              ),
              (
                  '''from .validate_p9_s8c1c_remaining_entry_random_config_source_closure import (\n    _fixture as _random_fixture,\n)''',
                  '''from .validate_p9_s8c1c_remaining_entry_random_config_source_closure import (\n    _build_real_context as _s8c1c_build_real_context,\n    _dedupe as _s8c1c_dedupe,\n    _fixture as _random_fixture,\n)''',
              ),
              (
                  '''            and not wrong_provider.mutations\n            and not wrong_provider.events\n            and not wrong_provider.rng_events\n        ),''',
                  '''            and not wrong_provider.mutations\n            and tuple(event.event_id for event in wrong_provider.events)\n            == ("event:a2:wrong-provider",)\n            and all(event.process_only for event in wrong_provider.events)\n            and not wrong_provider.rng_events\n            and not wrong_provider.task_graph_projections\n            and not wrong_provider_dispatcher.ability_property_watchers.transports\n        ),''',
              ),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one validator replacement, found {count}: {old[:100]!r}')
              text = text.replace(old, new)

          marker = 'def _run_direct() -> dict[str, Any]:\n'
          if text.count(marker) != 1:
              raise SystemExit('expected exactly one _run_direct marker')
          helper = '''def _build_focused_direct_rulebook() -> tuple[RuleBook, dict[str, Any]]:\n    real_context = _s8c1c_build_real_context(TBGD_ROOT)\n    owned = real_context.lowering.build_owned_combatant_admission_projection(\n        offensive_action_only=True,\n        max_servant_count=1,\n    )\n    if not owned.ok:\n        raise AssertionError(\n            "owned combatant projection failed:"\n            + ",".join(sorted({item.code for item in owned.issues}))\n        )\n    status_view = real_context.status_bundle.view\n    callbacks = _s8c1c_dedupe(\n        (*owned.status_callbacks, *real_context.status_bundle.callbacks),\n        "callback_id",\n    )\n    status_tasks = _s8c1c_dedupe(\n        (*owned.status_callback_tasks, *real_context.status_bundle.status_tasks),\n        "task_id",\n    )\n    phases = _s8c1c_dedupe(\n        (*owned.ability_phases, *status_view.ability_phases),\n        "phase_id",\n    )\n    ability_tasks = _s8c1c_dedupe(\n        (*owned.ability_tasks, *status_view.ability_tasks),\n        "task_id",\n    )\n    effects = _s8c1c_dedupe(\n        (*owned.effects, *status_view.effects),\n        "effect_id",\n    )\n    conditions = _s8c1c_dedupe(\n        (*owned.conditions, *status_view.conditions),\n        "condition_id",\n    )\n    targets = _s8c1c_dedupe(\n        (*owned.target_expressions, *status_view.target_expressions),\n        "target_expression_id",\n    )\n    queue_intents = _s8c1c_dedupe(\n        (*owned.queue_intents, *real_context.status_bundle.queue_intents),\n        "queue_intent_id",\n    )\n    status_event_families = tuple(\n        _lower_status_event_families(list(callbacks), list(status_tasks))\n    )\n    engine_rules = build_engine_rule_registry()\n    view = CanonicalIR(\n        version=status_view.version,\n        character_ability_source_graph_catalog=real_context.source_graph,\n        entities=owned.entities,\n        standalone_ability_graphs=status_view.standalone_ability_graphs,\n        ability_phases=phases,\n        ability_tasks=ability_tasks,\n        effects=effects,\n        conditions=conditions,\n        formulas=owned.formulas,\n        target_expressions=targets,\n        status_callbacks=callbacks,\n        status_callback_tasks=status_tasks,\n        status_event_families=status_event_families,\n        status_damage_emissions=owned.status_damage_emissions,\n        damage_modifiers=owned.damage_modifiers,\n        action_delay_emissions=owned.action_delay_emissions,\n        queue_intents=queue_intents,\n        skill_continuations=owned.skill_continuations,\n        triggers=owned.triggers,\n        servant_definitions=owned.servant_definitions,\n        action_definitions=owned.action_definitions,\n        action_ability_bindings=owned.action_ability_bindings,\n        action_admissions=owned.action_admissions,\n        unit_birth_templates=owned.unit_birth_templates,\n        combatant_action_sets=owned.combatant_action_sets,\n        action_events=owned.action_events,\n        hit_profiles=owned.hit_profiles,\n        skill_formula_bindings=owned.skill_formula_bindings,\n        damage_emissions=owned.damage_emissions,\n        toughness_emissions=owned.toughness_emissions,\n        avatar_profiles=owned.avatar_profiles,\n        character_data_cards=owned.character_data_cards,\n        character_equipment_eligibilities=owned.character_equipment_eligibilities,\n        character_mechanism_slots=owned.character_mechanism_slots,\n        character_trace_nodes=owned.character_trace_nodes,\n        character_eidolon_slots=owned.character_eidolon_slots,\n        bounce_policies=owned.bounce_policies,\n        timeline_rules=engine_rules.timeline_rules,\n        resource_rules=engine_rules.resource_rules,\n        damage_formula_rules=engine_rules.damage_formula_rules,\n        damage_route_rules=engine_rules.damage_route_rules,\n        shield_priority_rules=engine_rules.shield_priority_rules,\n        metadata={\n            "validation_scope": "p9_a2_focused_direct",\n            "full_tbgd_lowering_build_count": 0,\n        },\n    )\n    catalog = materialize_character_runtime_task_graph_catalog(\n        real_context.source_catalog,\n        view,\n        source_snapshot=real_context.snapshot,\n        definition_scope_complete=True,\n    )\n    external_dependencies = build_external_task_topology_dependency_ledger(\n        action_ability_bindings=view.action_ability_bindings,\n        ability_phases=view.ability_phases,\n        ability_tasks=view.ability_tasks,\n        standalone_ability_graphs=view.standalone_ability_graphs,\n        status_callbacks=view.status_callbacks,\n        status_callback_tasks=view.status_callback_tasks,\n    )\n    canonical = replace(\n        view,\n        task_graph_catalog=catalog,\n        external_task_topology_dependencies=external_dependencies,\n    )\n    return RuleBook(canonical), {\n        "full_tbgd_lowering_build_count": 0,\n        "owned_action_definition_count": len(owned.action_definitions),\n        "status_callback_count": len(callbacks),\n        "status_task_count": len(status_tasks),\n        "task_graph_entry_count": len(catalog.entries),\n        "external_task_topology_dependency_count": len(external_dependencies),\n    }\n\n\n'''
          text = text.replace(marker, helper + marker)
          old_direct = '''    canonical = TBGDLowering(TBGD_ROOT).build()\n    rules = RuleBook(canonical)\n    if not getattr(rules.ir, "task_graph_catalog", None):\n        raise AssertionError("production CanonicalIR has no task graph catalog")'''
          new_direct = '''    rules, build_evidence = _build_focused_direct_rulebook()\n    if not getattr(rules.ir, "task_graph_catalog", None):\n        raise AssertionError("focused production CanonicalIR has no task graph catalog")'''
          if text.count(old_direct) != 1:
              raise SystemExit('expected exactly one Direct builder replacement')
          text = text.replace(old_direct, new_direct)
          old_return = '''        "attempts": attempts[-80:],\n        "resource": {'''
          new_return = '''        "attempts": attempts[-80:],\n        "build_evidence": build_evidence,\n        "resource": {'''
          if text.count(old_return) != 1:
              raise SystemExit('expected exactly one Direct evidence replacement')
          text = text.replace(old_return, new_return)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff --stat

      - name: Compile scoped A2 files
        working-directory: hsr_v075_baseline_clean/hsr/simulator_v8_clean_core
        run: |
          /usr/bin/time -v -o /tmp/p9-a2-compile.time \
            python -m compileall -q \
              core/executor.py \
              systems/event_dispatch.py \
              systems/status_callbacks.py \
              systems/ability.py \
              tools/validate_p9_a2_action_window_status_nested_ability_transport.py
          code=$?
          cat /tmp/p9-a2-compile.time
          echo "exit_code=$code"
          exit "$code"

      - name: A2 Fast diagnostic
        id: a2_fast
        continue-on-error: true
        working-directory: hsr_v075_baseline_clean/hsr/simulator_v8_clean_core
        run: |
          /usr/bin/time -v -o /tmp/p9-a2-fast.time \
            python tools/validate_p9_a2_action_window_status_nested_ability_transport.py --fast
          code=$?
          cat /tmp/p9-a2-fast.time
          echo "exit_code=$code"
          exit "$code"

      - name: A2 real Direct diagnostic
        if: always()
        working-directory: hsr_v075_baseline_clean/hsr/simulator_v8_clean_core
        run: |
          /usr/bin/time -v -o /tmp/p9-a2-direct.time \
            python tools/validate_p9_a2_action_window_status_nested_ability_transport.py --direct
          code=$?
          cat /tmp/p9-a2-direct.time
          echo "exit_code=$code"
          exit "$code"

      - name: Fixed-base diff check
        if: always()
        run: |
          /usr/bin/time -v -o /tmp/p9-a2-diff.time \
            git diff --check bd1a4ac94ca394d2ea563d086eaf56e9ed45b285 HEAD
          code=$?
          cat /tmp/p9-a2-diff.time
          echo "exit_code=$code"
          exit "$code"

      - name: Preserve Fast gate
        if: always()
        run: |
          echo "fast_outcome=${{ steps.a2_fast.outcome }}"
          test "${{ steps.a2_fast.outcome }}" = "success"

      - name: Upload patched validator for connector commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9-a2-patched-validator
          path: hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_a2_action_window_status_nested_ability_transport.py
          if-no-files-found: error
