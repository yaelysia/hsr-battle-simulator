name: P9 S8C1 Validator Remediation

on:
  pull_request:
    paths:
      - 'hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_s8c1_random_config_graph_aggregate.py'
      - '.github/workflows/p9-s8c1-pr-validation.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply mechanical validator identity fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_s8c1_random_config_graph_aggregate.py')
          text = path.read_text()
          old = '''    graphs = _dedupe(\n        (item for view in views for item in view.standalone_ability_graphs),\n        "graph_id",\n    )'''
          new = '''    graphs = _dedupe(\n        (item for view in views for item in view.standalone_ability_graphs),\n        "standalone_ability_graph_id",\n    )'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one validator replacement target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff --exit-code --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_s8c1_random_config_graph_aggregate.py
          git commit -m 'fix(p9): use standalone graph identity in S8C1 validator'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
