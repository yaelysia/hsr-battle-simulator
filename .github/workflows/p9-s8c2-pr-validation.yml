name: P9 S8C RandomConfig R1 Canonical Reference Bootstrap

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/p9-s8c2-pr-validation.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Preserve formal reference identity on admitted RandomConfig
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tbgd/task_graph_materializer.py')
          text = path.read_text()
          old = '''            node_kind="branch",\n            references=tuple(\n                ref\n                for ref in node.references\n                if not _action_random_config_ignorable_reference(ref)\n            ),\n            materialization_status="materialized",\n'''
          new = '''            node_kind="branch",\n            materialization_status="materialized",\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'references=tuple(\n                ref\n                for ref in node.references' in text:
              raise SystemExit('unexpected RandomConfig reference filtering shape')
          path.write_text(text)
          PY

      - name: Commit scoped materializer fix
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tbgd/task_graph_materializer.py; then
            echo 'no materializer diff to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tbgd/task_graph_materializer.py
          git commit -m 'fix: preserve action RandomConfig formal reference identity [skip ci]'
          git push origin "HEAD:${HEAD_REF}"
