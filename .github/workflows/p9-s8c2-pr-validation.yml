name: P9 S8C RandomConfig R1 Real Action Diagnostic

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/p9-s8c2-pr-validation.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: true
      - name: Inspect dynamically ranked real action blockers
        shell: bash
        run: |
          env PYTHONPATH=hsr_v075_baseline_clean/hsr PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import json
          from collections import defaultdict
          from dataclasses import replace
          from simulator_v8_clean_core.rules.rulebook import RuleBook
          from simulator_v8_clean_core.core.executor import CombatExecutor
          from simulator_v8_clean_core.core.model import ActionCommand
          from simulator_v8_clean_core.tbgd.lowering import TBGDLowering, build_character_action_definition_ir
          from simulator_v8_clean_core.tbgd.task_graph_materializer import materialize_ability_task_graph_catalog
          from simulator_v8_clean_core.tools.validate_p9_s8c1b_action_entry_weighted_selection import (
              DEFAULT_TBGD, _build_slice, _candidate_action_ids,
          )
          from simulator_v8_clean_core.tools.validate_p9_s8c_random_config_action_caller import _real_action_state

          root = DEFAULT_TBGD.resolve()
          lowering = TBGDLowering(root)
          source_graph = lowering.build_character_ability_source_graph_catalog()
          snapshot = lowering._character_ability_raw_snapshot
          scope = lowering._character_ability_scope_catalog
          source_catalog = lowering.build_character_control_flow_contract_catalog(snapshot=snapshot, scope_catalog=scope)
          candidate_ids = _candidate_action_ids(source_graph, source_catalog)
          definitions = defaultdict(list)
          for item in build_character_action_definition_ir(root):
              definitions[item.action_id].append(item)
          print(json.dumps({'candidate_head': list(candidate_ids[:12])}, sort_keys=True))
          attempts = 0
          for rank, action_id in enumerate(candidate_ids[:12]):
              for definition in sorted(definitions.get(action_id, ()), key=lambda item: item.level):
                  try:
                      canonical = _build_slice(lowering, definition, snapshot, scope, source_graph)
                      catalog = materialize_ability_task_graph_catalog(source_catalog, canonical, source_snapshot=snapshot)
                  except Exception as exc:
                      print(json.dumps({'rank':rank,'action_id':action_id,'level':definition.level,'materialize':f'{type(exc).__name__}:{exc}'}, sort_keys=True))
                      continue
                  weighted = [g for g in catalog.graphs if g.entry_kind == 'ability_phase_callback' and g.weighted_selections]
                  if not weighted:
                      continue
                  runtime = replace(canonical, task_graph_catalog=catalog)
                  admissions = [a for a in runtime.action_admissions if a.action_id == action_id and a.action_level == definition.level and a.coverage_status == 'executable']
                  print(json.dumps({
                      'rank':rank,'action_id':action_id,'level':definition.level,
                      'weighted_entries':[g.entry_id for g in weighted],
                      'admissions':[{'owner':a.owner_entity_ref,'modes':list(a.submission_modes),'windows':list(a.allowed_windows),'role':a.action_role} for a in admissions],
                  }, sort_keys=True))
                  for admission in admissions:
                      if 'external_turn' not in admission.submission_modes:
                          continue
                      for window in admission.allowed_windows:
                          state = _real_action_state(admission.owner_entity_ref, window)
                          rules = RuleBook(runtime)
                          executor = CombatExecutor(rules)
                          query = executor.action_targets.query(state, 'actor', action_id, definition.level)
                          row = {'rank':rank,'action_id':action_id,'level':definition.level,'window':window,'query_status':query.status,'query_reason':query.blocked_reason}
                          if not query.resolved:
                              print(json.dumps(row, sort_keys=True)); continue
                          submitted = () if query.selection_mode == 'automatic' else tuple(query.candidate_ids[:(query.selection_min or 1)])
                          accepted = executor.action_targets.accept(state, query, submitted)
                          row['accept_status'] = accepted.status
                          row['accept_reason'] = accepted.blocked_reason
                          if not accepted.accepted or accepted.context is None:
                              print(json.dumps(row, sort_keys=True)); continue
                          command = ActionCommand('actor', action_id, definition.level, submitted, metadata={'rng_mode':'deterministic_seed'})
                          decision = executor.action_contract.evaluate(state, command, target_selection_fingerprint=accepted.context.context_fingerprint)
                          row['contract_ok'] = decision.ok
                          row['contract_reason'] = decision.blocked_reason
                          after, transition = executor.execute(command, state, target_selection_context=accepted.context)
                          row['successor_eligible'] = transition.outcome.successor_eligible
                          row['outcome_reasons'] = list(transition.outcome.reason_codes[:16])
                          row['rng_count'] = len(transition.rng_events)
                          print(json.dumps(row, sort_keys=True))
                          attempts += 1
                          if attempts >= 12:
                              raise SystemExit(0)
          PY
