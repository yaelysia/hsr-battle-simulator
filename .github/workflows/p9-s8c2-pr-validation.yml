name: P9 S8C RandomConfig R1 Materializer Diagnostic

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/p9-s8c2-pr-validation.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: true

      - name: Inspect real action RandomConfig graph obligations
        shell: bash
        run: |
          env PYTHONPATH=hsr_v075_baseline_clean/hsr PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import json
          from collections import defaultdict
          from simulator_v8_clean_core.tbgd.lowering import TBGDLowering, build_character_action_definition_ir
          from simulator_v8_clean_core.tbgd.task_graph_materializer import materialize_ability_task_graph_catalog
          from simulator_v8_clean_core.tools.validate_p9_s8c1b_action_entry_weighted_selection import (
              DEFAULT_TBGD,
              _build_slice,
              _candidate_action_ids,
          )

          root = DEFAULT_TBGD.resolve()
          lowering = TBGDLowering(root)
          source_graph = lowering.build_character_ability_source_graph_catalog()
          snapshot = lowering._character_ability_raw_snapshot
          scope = lowering._character_ability_scope_catalog
          source_catalog = lowering.build_character_control_flow_contract_catalog(
              snapshot=snapshot,
              scope_catalog=scope,
          )
          candidates = _candidate_action_ids(source_graph, source_catalog)
          definitions = defaultdict(list)
          for item in build_character_action_definition_ir(root):
              definitions[item.action_id].append(item)
          emitted = 0
          for action_id in candidates:
              for definition in sorted(definitions.get(action_id, ()), key=lambda item: item.level):
                  try:
                      canonical = _build_slice(lowering, definition, snapshot, scope, source_graph)
                      catalog = materialize_ability_task_graph_catalog(
                          source_catalog,
                          canonical,
                          source_snapshot=snapshot,
                      )
                  except Exception as exc:
                      print(json.dumps({
                          'action_id': action_id,
                          'level': definition.level,
                          'stage': 'materialize_error',
                          'error': f'{type(exc).__name__}:{exc}',
                      }, sort_keys=True))
                      continue
                  for graph in catalog.graphs:
                      if graph.entry_kind != 'ability_phase_callback' or not graph.weighted_selections:
                          continue
                      by_id = {node.graph_node_id: node for node in graph.nodes}
                      for selection in graph.weighted_selections:
                          node = by_id[selection.graph_node_id]
                          branches = []
                          for branch in node.branches:
                              branches.append({
                                  'ordinal': branch.ordinal,
                                  'branch_id': branch.branch_id,
                                  'children': [
                                      {
                                          'formal_task_id': by_id[child].formal_task_id,
                                          'family': by_id[child].source_family,
                                          'node_kind': by_id[child].node_kind,
                                          'materialization_status': by_id[child].materialization_status,
                                          'owner_domains': list(by_id[child].owner_domains),
                                          'status_reason': by_id[child].status_reason,
                                          'references': [
                                              {
                                                  'kind': ref.reference_kind,
                                                  'status': ref.resolution_status,
                                                  'owner': ref.owner_domain,
                                                  'reason': ref.blocked_reason,
                                              }
                                              for ref in by_id[child].references
                                          ],
                                      }
                                      for child in branch.child_node_ids
                                  ],
                              })
                          print(json.dumps({
                              'action_id': action_id,
                              'level': definition.level,
                              'entry_id': graph.entry_id,
                              'phase_id': graph.owner_id,
                              'callback_kind': graph.callback_kind,
                              'random': {
                                  'formal_task_id': node.formal_task_id,
                                  'family': node.source_family,
                                  'node_kind': node.node_kind,
                                  'materialization_status': node.materialization_status,
                                  'owner_domains': list(node.owner_domains),
                                  'status_reason': node.status_reason,
                                  'termination_kind': node.termination_kind,
                                  'references': [
                                      {
                                          'kind': ref.reference_kind,
                                          'status': ref.resolution_status,
                                          'owner': ref.owner_domain,
                                          'reason': ref.blocked_reason,
                                      }
                                      for ref in node.references
                                  ],
                                  'choice_count': len(selection.choices),
                                  'branch_count': len(node.branches),
                              },
                              'branches': branches,
                          }, sort_keys=True))
                          emitted += 1
                          if emitted >= 6:
                              raise SystemExit(0)
          if emitted == 0:
              raise SystemExit('no weighted formal action graph emitted')
          PY
