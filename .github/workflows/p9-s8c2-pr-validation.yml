name: P9 S8C RandomConfig R1 Direct Bootstrap

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/p9-s8c2-pr-validation.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch real CombatExecutor Direct validator
        shell: bash
        env:
          DIRECT_ZLIB_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          import zlib
          from pathlib import Path

          path = Path('hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_s8c_random_config_action_caller.py')
          text = path.read_text()
          text = text.replace(
              'import time\nfrom pathlib import Path\n',
              'import time\nfrom collections import defaultdict\nfrom collections.abc import Mapping\nfrom dataclasses import replace\nfrom pathlib import Path\n',
              1,
          )
          text = text.replace(
              'from ..core.model import ActionCommand, BattleState, TargetResolution\n',
              'from ..core.executor import CombatExecutor\nfrom ..core.model import ActionCommand, BattleState, TargetResolution, UnitState\n',
              1,
          )
          marker = 'from ..systems.task_graph import (\n'
          imports = (
              'from ..tbgd.lowering import TBGDLowering, build_character_action_definition_ir\n'
              'from ..tbgd.task_graph_materializer import materialize_ability_task_graph_catalog\n'
          )
          if imports not in text:
              text = text.replace(marker, imports + marker, 1)
          text = text.replace(
              'from .validate_p9_s8c1b_action_entry_weighted_selection import (\n    DEFAULT_TBGD,\n    _run_direct as _run_s8c1b_direct,\n)\n',
              'from .validate_p9_s8c1b_action_entry_weighted_selection import (\n    DEFAULT_TBGD,\n    _build_slice,\n    _candidate_action_ids,\n    _verify_selection,\n)\n',
              1,
          )
          start = text.index('def _run_direct(root: Path) -> dict[str, Any]:\n')
          end = text.index('\n\ndef main() -> int:\n', start)
          direct = zlib.decompress(base64.b64decode(os.environ['DIRECT_ZLIB_B64'])).decode().rstrip()
          text = text[:start] + direct + text[end:]
          path.write_text(text)
          PY

      - name: Commit focused Direct validator
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_s8c_random_config_action_caller.py; then
            echo 'no validator diff to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_s8c_random_config_action_caller.py
          git commit -m 'test: run PR9 Direct through CombatExecutor [skip ci]'
          git push origin "HEAD:${HEAD_REF}"
