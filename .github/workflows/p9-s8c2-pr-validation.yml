name: P9 S8C RandomConfig R1 Bootstrap

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/p9-s8c2-pr-validation.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply R1 scoped prerequisite
        shell: bash
        env:
          HELPER_B64: 
          DISP_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          materializer = Path('hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tbgd/task_graph_materializer.py')
          text = materializer.read_text()
          helper = base64.b64decode(os.environ['HELPER_B64']).decode()
          if 'def _admit_action_random_config_nodes(' not in text:
              anchor = '\n\ndef _source_topology(\n'
              if text.count(anchor) != 1:
                  raise SystemExit('materializer helper anchor mismatch')
              text = text.replace(anchor, '\n\n' + helper + anchor, 1)
          admission_anchor = '    has_obligation = any(item.materialization_status == "deferred" for item in nodes) or any(\n        ref.resolution_status != "resolved" for node in nodes for ref in node.references\n    )\n'
          if 'nodes = list(_admit_action_random_config_nodes(' not in text:
              if text.count(admission_anchor) != 1:
                  raise SystemExit('materializer admission anchor mismatch')
              text = text.replace(
                  admission_anchor,
                  '    nodes = list(\n        _admit_action_random_config_nodes(\n            entry_kind,\n            tuple(nodes),\n            tuple(weighted),\n        )\n    )\n' + admission_anchor,
                  1,
              )
          start = text.index('def _materialization_dispositions(\n')
          end = text.index('\n\ndef _catalog(\n', start)
          if 'action_random_links_by_record' not in text[start:end]:
              replacement = base64.b64decode(os.environ['DISP_B64']).decode()
              text = text[:start] + replacement + text[end:]
          materializer.write_text(text)

          s8c1b = Path('hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_s8c1b_action_entry_weighted_selection.py')
          text = s8c1b.read_text()
          old = '    if (\n        node.materialization_status != "deferred"\n        or node.owner_domains != ("hit_random_sequence",)\n    ):\n        raise AssertionError("RandomConfig node no longer defers to hit_random_sequence")\n'
          new = '    if (\n        node.materialization_status != "materialized"\n        or node.owner_domains != ("task_graph_execution",)\n    ):\n        raise AssertionError("formal action RandomConfig did not retire hit_random_sequence")\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'formal action RandomConfig did not retire hit_random_sequence' not in text:
              raise SystemExit('S8C1B action expectation anchor mismatch')
          old = '            "random_config_still_deferred": True,\n            "runtime_behavior_changed": False,\n            "full_canonical_ir_build_count": 0,\n'
          new = '            "action_random_config_materialized": True,\n            "action_materializer_runtime_admission_changed": True,\n            "full_canonical_ir_build_count": 0,\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif '"action_random_config_materialized": True' not in text:
              raise SystemExit('S8C1B direct predicate anchor mismatch')
          s8c1b.write_text(text)
          PY

      - name: Commit scoped R1 prerequisite
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- \
            hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tbgd/task_graph_materializer.py \
            hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_s8c1b_action_entry_weighted_selection.py; then
            echo 'no scoped diff to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tbgd/task_graph_materializer.py \
            hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_s8c1b_action_entry_weighted_selection.py
          git commit -m 'feat: admit action RandomConfig materialization [skip ci]'
          git push origin "HEAD:${HEAD_REF}"
