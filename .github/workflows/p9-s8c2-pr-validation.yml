name: P9 S8C RandomConfig R1 Structural Reference Bootstrap

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/p9-s8c2-pr-validation.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply action-only structural reference retirement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tbgd/task_graph_materializer.py')
          text = path.read_text()

          helper_anchor = '\n\ndef _admit_action_random_config_nodes(\n'
          helper = '''\n\ndef _action_random_config_ignorable_reference(\n    reference: TaskGraphDefinitionReferenceIR,\n) -> bool:\n    return (\n        reference.reference_kind == "effect"\n        and reference.resolution_status == "deferred"\n        and reference.owner_domain == "event_effect_execution"\n        and not reference.source_contract_record_id\n        and reference.blocked_reason\n        == "task_graph_definition_not_admitted:effect:unsupported"\n    )\n'''
          if 'def _action_random_config_ignorable_reference(' not in text:
              if text.count(helper_anchor) != 1:
                  raise SystemExit('RandomConfig admission helper anchor mismatch')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          old = '            or any(ref.resolution_status != "resolved" for ref in node.references)\n'
          new = '''            or any(\n                ref.resolution_status != "resolved"\n                and not _action_random_config_ignorable_reference(ref)\n                for ref in node.references\n            )\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif '_action_random_config_ignorable_reference(ref)' not in text:
              raise SystemExit('RandomConfig deferred-reference eligibility anchor mismatch')

          old = '''            node_kind="branch",\n            materialization_status="materialized",\n            owner_domains=("task_graph_execution",),\n            status_reason="",\n'''
          new = '''            node_kind="branch",\n            references=tuple(\n                ref\n                for ref in node.references\n                if not _action_random_config_ignorable_reference(ref)\n            ),\n            materialization_status="materialized",\n            owner_domains=("task_graph_execution",),\n            status_reason="",\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'references=tuple(\n                ref\n                for ref in node.references' not in text:
              raise SystemExit('RandomConfig reference retirement replacement anchor mismatch')

          path.write_text(text)
          PY

      - name: Commit scoped materializer fix
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tbgd/task_graph_materializer.py; then
            echo 'no materializer diff to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tbgd/task_graph_materializer.py
          git commit -m 'fix: retire action RandomConfig structural effect reference [skip ci]'
          git push origin "HEAD:${HEAD_REF}"
