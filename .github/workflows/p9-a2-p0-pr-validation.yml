name: P9 A2 P0 read-only callback closure audit

on:
  push:
    branches:
      - "plan/p9-a2-p0-action-window-status-admission"
    paths:
      - ".github/workflows/p9-a2-p0-pr-validation.yml"

jobs:
  audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact diagnostic head and pinned TBGD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Replay candidate and print action-window callback closure
        env:
          WRITEBACK_SOURCE_COMMIT: "874e9f9231e786f6474569ac891bd14f87227a71"
          BASE_SHA: "bd1a4ac94ca394d2ea563d086eaf56e9ed45b285"
          HELPER_SOURCE_COMMIT: "23443928ec00bfbeabe30fe2b9c569b03b795858"
          FOCUSED_BUILDER_SOURCE_COMMIT: "988c85bfd77dee79a5108beb9d87d398ac86a12d"
          FINAL_WORKFLOW_SOURCE_COMMIT: "bc3d745c9e96d1c44c01fed1a7b26a365ab0719d"
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import json
          import os
          import re
          import subprocess
          import sys
          import textwrap
          from pathlib import Path

          workflow = Path(".github/workflows/p9-a2-p0-pr-validation.yml")
          source = subprocess.check_output(
              ["git", "show", f"{os.environ['WRITEBACK_SOURCE_COMMIT']}:{workflow}"],
              text=True,
          )
          match = re.search(
              r"          python - <<'PY'\n(.*?)\n          PY\n",
              source,
              re.S,
          )
          if match is None:
              raise SystemExit("writeback python block missing")
          candidate_script = textwrap.dedent(match.group(1))
          compile(candidate_script, "<candidate-writeback>", "exec")
          exec(candidate_script, {"__name__": "__candidate__"})

          validator = Path(
              "hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/"
              "validate_p9_a2_p0_action_window_status_callback_admission_finalization.py"
          )
          spec = importlib.util.spec_from_file_location("candidate_validator", validator)
          if spec is None or spec.loader is None:
              raise SystemExit("validator import spec unavailable")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          lowerer, ir, rulebook, audit, focused_denominator = module._build_focused_direct_ir()

          denominator = [
              row
              for row in audit
              if row.get("source_mode") == "mainline_avatar_ability"
              and row.get("action_window_runtime_source")
          ]
          callbacks = {item.callback_id: item for item in ir.status_callbacks}
          tasks_by_callback = {}
          for task in ir.status_callback_tasks:
              tasks_by_callback.setdefault(task.callback_id, []).append(task)

          print("FOCUSED_DENOMINATOR=" + str(focused_denominator))
          print("ACTION_WINDOW_AUDIT=" + json.dumps(denominator, sort_keys=True))
          for row in denominator:
              callback_id = str(row["callback_id"])
              owner = callbacks.get(callback_id)
              if owner is None:
                  print("CLOSURE_OWNER_MISSING=" + callback_id)
                  continue
              closure = {
                  "callback_id": owner.callback_id,
                  "event": owner.event,
                  "source_path": owner.source.source_path,
                  "callback_task_ids": list(owner.task_ids),
                  "owned_tasks": [
                      {
                          "task_id": task.task_id,
                          "event": task.event,
                          "source_path": task.source.source_path,
                          "opcode": task.opcode,
                          "coverage_status": task.coverage_status,
                          "blocked_reason": task.blocked_reason,
                          "effect_id": task.effect_id,
                          "linked_standalone_graph_id": task.linked_standalone_graph_id,
                          "linked_ability_phase_id": task.linked_ability_phase_id,
                      }
                      for task in sorted(
                          tasks_by_callback.get(callback_id, ()),
                          key=lambda item: item.task_id,
                      )
                  ],
              }
              print("CALLBACK_CLOSURE=" + json.dumps(closure, sort_keys=True))
          PY
