name: P9 A2 P0 bootstrap implementation

on:
  push:
    branches:
      - "plan/p9-a2-p0-action-window-status-admission"
    paths:
      - ".github/workflows/p9-a2-p0-pr-validation.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoped lowering patch and install final validation workflow
        env:
          HELPER_B64: ""
          FINAL_WORKFLOW_B64: ""
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          lowering_path = Path("hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tbgd/lowering.py")
          workflow_path = Path(".github/workflows/p9-a2-p0-pr-validation.yml")
          text = lowering_path.read_text(encoding="utf-8")
          helper = base64.b64decode(os.environ["HELPER_B64"]).decode("utf-8")
          helper_anchor = "    return linked\n\n\ndef _link_status_effect_runtime_fields(\n"
          if "_finalize_action_window_status_callback_admission(" not in text:
              if text.count(helper_anchor) != 1:
                  raise SystemExit("helper insertion anchor missing or ambiguous")
              text = text.replace(
                  helper_anchor,
                  "    return linked\n" + helper + "\n\ndef _link_status_effect_runtime_fields(\n",
                  1,
              )

          call_anchor = (
              "        status_event_families = _lower_status_event_families(status_callbacks, status_callback_tasks)\n"
              "        status_event_blocked_reasons = _status_event_blocked_reasons(status_event_families)\n"
          )
          call_replacement = (
              "        status_event_families = _lower_status_event_families(status_callbacks, status_callback_tasks)\n"
              "        (\n"
              "            status_callbacks,\n"
              "            status_callback_tasks,\n"
              "            status_callback_finalization_audit,\n"
              "        ) = _finalize_action_window_status_callback_admission(\n"
              "            status_callbacks,\n"
              "            status_callback_tasks,\n"
              "            status_event_families,\n"
              "            effects,\n"
              "            standalone_ability_graphs,\n"
              "            ability_phases,\n"
              "            formal_status_root_paths,\n"
              "        )\n"
              "        self._action_window_status_callback_finalization_audit = (\n"
              "            status_callback_finalization_audit\n"
              "        )\n"
              "        status_event_families = _lower_status_event_families(\n"
              "            status_callbacks, status_callback_tasks\n"
              "        )\n"
              "        status_event_blocked_reasons = _status_event_blocked_reasons(status_event_families)\n"
          )
          if "status_callback_finalization_audit" not in text:
              if text.count(call_anchor) != 1:
                  raise SystemExit("build insertion anchor missing or ambiguous")
              text = text.replace(call_anchor, call_replacement, 1)

          lowering_path.write_text(text, encoding="utf-8")
          workflow_path.write_bytes(base64.b64decode(os.environ["FINAL_WORKFLOW_B64"]))
          PY

          python -m compileall -q \
            hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tbgd/lowering.py \
            hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_a2_p0_action_window_status_callback_admission_finalization.py
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tbgd/lowering.py \
            .github/workflows/p9-a2-p0-pr-validation.yml
          git diff --cached --check
          git commit -m "Implement A2-P0 status callback admission finalizer"
          git push origin HEAD:${GITHUB_REF_NAME}
