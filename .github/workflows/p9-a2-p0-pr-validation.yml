name: P9 A2 P0 read-only closure helper inspection

on:
  push:
    branches:
      - "plan/p9-a2-p0-action-window-status-admission"
    paths:
      - ".github/workflows/p9-a2-p0-pr-validation.yml"

jobs:
  inspect:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Print closure decision context from pinned helper
        env:
          HELPER_SOURCE_COMMIT: "23443928ec00bfbeabe30fe2b9c569b03b795858"
        run: |
          python - <<'PY'
          import base64, os, re, subprocess
          from pathlib import Path
          workflow = Path(".github/workflows/p9-a2-p0-pr-validation.yml")
          text = subprocess.check_output(
              ["git", "show", f"{os.environ['HELPER_SOURCE_COMMIT']}:{workflow}"],
              text=True,
          )
          match = re.search(r'HELPER_B64: "([A-Za-z0-9+/=]+)"', text)
          if match is None:
              raise SystemExit("helper payload missing")
          lines = base64.b64decode(match.group(1)).decode().splitlines()
          hits = [i for i, line in enumerate(lines) if "callback_closure_blocked" in line]
          if not hits:
              raise SystemExit("callback_closure_blocked not found")
          for hit in hits:
              lo = max(0, hit - 35)
              hi = min(len(lines), hit + 35)
              print(f"CLOSURE_CONTEXT_{hit}_BEGIN")
              print("\n".join(lines[lo:hi]))
              print(f"CLOSURE_CONTEXT_{hit}_END")
          PY
