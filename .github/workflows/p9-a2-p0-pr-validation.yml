name: P9 A2 P0 one-time authorized writeback

on:
  push:
    branches:
      - "plan/p9-a2-p0-action-window-status-admission"
    paths:
      - ".github/workflows/p9-a2-p0-pr-validation.yml"

jobs:
  apply:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact triggering head and pinned TBGD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Apply authorized scoped patch, validate, and restore read-only workflow
        env:
          EXPECTED_PARENT: "61938fdf06d1c926cf8eb1eeb7855b2aca013734"
          EXPECTED_BRANCH: "plan/p9-a2-p0-action-window-status-admission"
          HELPER_SOURCE_COMMIT: "23443928ec00bfbeabe30fe2b9c569b03b795858"
          FINAL_WORKFLOW_SOURCE_COMMIT: "bc3d745c9e96d1c44c01fed1a7b26a365ab0719d"
          FOCUSED_BUILDER_ZB64: ""
        run: |
          set -euo pipefail
          current_head="$(git rev-parse HEAD)"
          parent_head="$(git rev-parse HEAD^)"
          test "$current_head" = "$GITHUB_SHA"
          test "$parent_head" = "$EXPECTED_PARENT"
          remote_head="$(git ls-remote origin "refs/heads/${EXPECTED_BRANCH}" | cut -f1)"
          test "$remote_head" = "$current_head"

          python - <<'PY'
          import ast, base64, os, re, subprocess, zlib
          from pathlib import Path
          lowering_path = Path("hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tbgd/lowering.py")
          validator_path = Path("hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_a2_p0_action_window_status_callback_admission_finalization.py")
          workflow_path = Path(".github/workflows/p9-a2-p0-pr-validation.yml")

          pinned = subprocess.check_output(["git", "show", f"{os.environ['HELPER_SOURCE_COMMIT']}:{workflow_path}"], text=True)
          match = re.search(r'HELPER_B64: "([A-Za-z0-9+/=]+)"', pinned)
          if match is None:
              raise SystemExit("pinned validated helper missing")
          helper = base64.b64decode(match.group(1)).decode()
          ast.parse(helper)

          lowering = lowering_path.read_text()
          helper_anchor = "    return linked\n\n\ndef _link_status_effect_runtime_fields(\n"
          call_anchor = "        status_event_families = _lower_status_event_families(status_callbacks, status_callback_tasks)\n        status_event_blocked_reasons = _status_event_blocked_reasons(status_event_families)\n"
          if "_finalize_action_window_status_callback_admission(" in lowering or lowering.count(helper_anchor) != 1 or lowering.count(call_anchor) != 1:
              raise SystemExit("lowering anchor/state mismatch")
          lowering = lowering.replace(helper_anchor, "    return linked\n" + helper + "\n\ndef _link_status_effect_runtime_fields(\n", 1)
          call_replacement = "        status_event_families = _lower_status_event_families(status_callbacks, status_callback_tasks)\n        (\n            status_callbacks,\n            status_callback_tasks,\n            status_callback_finalization_audit,\n        ) = _finalize_action_window_status_callback_admission(\n            status_callbacks,\n            status_callback_tasks,\n            status_event_families,\n            effects,\n            standalone_ability_graphs,\n            ability_phases,\n            formal_status_root_paths,\n        )\n        self._action_window_status_callback_finalization_audit = (\n            status_callback_finalization_audit\n        )\n        status_event_families = _lower_status_event_families(\n            status_callbacks, status_callback_tasks\n        )\n        status_event_blocked_reasons = _status_event_blocked_reasons(status_event_families)\n"
          lowering_path.write_text(lowering.replace(call_anchor, call_replacement, 1))

          validator = validator_path.read_text()
          old_imports = "from hsr.simulator_v8_clean_core.rules.rulebook import RuleBook\nfrom hsr.simulator_v8_clean_core.tbgd.lowering import (\n    TBGDLowering,\n    _finalize_action_window_status_callback_admission,\n)\n"
          new_imports = "from hsr.simulator_v8_clean_core import BASELINE_VERSION\nfrom hsr.simulator_v8_clean_core.rules.ir import CanonicalIR\nfrom hsr.simulator_v8_clean_core.rules.rulebook import RuleBook\nfrom hsr.simulator_v8_clean_core.tbgd.lowering import (\n    TBGDLowering,\n    _assign_character_ability_invocation_roles,\n    _block_status_callbacks_by_event_family,\n    _block_status_callback_tasks_by_callback,\n    _dedupe_target_expressions,\n    _finalize_action_window_status_callback_admission,\n    _link_status_trigger_ability_graphs,\n    _link_trigger_ability_graphs,\n    _lower_status_event_families,\n    _status_event_blocked_reasons,\n)\nfrom hsr.simulator_v8_clean_core.tbgd.task_graph_materializer import (\n    materialize_character_runtime_task_graph_catalog,\n)\n"
          if validator.count(old_imports) != 1:
              raise SystemExit("validator import anchor mismatch")
          validator = validator.replace(old_imports, new_imports, 1)
          validator = validator.replace('_git("diff", "--name-only", BASE_SHA, "HEAD")', '_git("diff", "--name-only", BASE_SHA)', 1)
          validator = validator.replace('_git("diff", "--unified=0", BASE_SHA, "HEAD", "--", LOWERING_PATH)', '_git("diff", "--unified=0", BASE_SHA, "--", LOWERING_PATH)', 1)
          builder = zlib.decompress(base64.b64decode(os.environ["FOCUSED_BUILDER_ZB64"])).decode()
          ast.parse(builder)
          start = validator.index("def run_direct() -> None:\n")
          end = validator.index("\n\ndef main() -> int:\n", start)
          direct = validator[start:end]
          old_build = "    lowerer = TBGDLowering(TBGD_ROOT)\n    ir = lowerer.build()\n    rulebook = RuleBook(ir)\n"
          new_build = "    lowerer, ir, rulebook, audit, focused_denominator = _build_focused_direct_ir()\n"
          old_audit = "    audit = getattr(lowerer, \"_action_window_status_callback_finalization_audit\", None)\n    if not isinstance(audit, tuple) or not audit:\n"
          if direct.count(old_build) != 1 or direct.count(old_audit) != 1:
              raise SystemExit("validator direct build anchors mismatch")
          direct = direct.replace(old_build, new_build, 1).replace(old_audit, "    if not isinstance(audit, tuple) or not audit:\n", 1)
          direct = direct.replace('        "mode": "direct",\n', '        "mode": "direct",\n        "builder": "focused_formal_character_source_denominator",\n        "focused_denominator": focused_denominator,\n', 1)
          nested_check = "        target_phase_ids = tuple(graph.phase_ids) if graph_id else (phase_id,)\n        if not target_phase_ids or any(\n            phases.get(target_phase_id) is None\n            or phases[target_phase_id].invocation_role != \"nested_only\"\n            for target_phase_id in target_phase_ids\n        ):\n            _fail(\"promoted_nested_target_role_not_resolved\")\n\n"
          if direct.count("        entries = [\n") != 1:
              raise SystemExit("validator formal root anchor mismatch")
          direct = direct.replace("        entries = [\n", nested_check + "        entries = [\n", 1)
          direct = direct.replace('        if task is not None and task.coverage_status == "executable":\n', '        if (\n            task is not None\n            and row.get("old_task_coverage_status") == "blocked"\n            and task.coverage_status == "executable"\n        ):\n', 1)
          validator = validator[:start] + builder.rstrip() + "\n\n" + direct + validator[end:]
          ast.parse(validator)
          validator_path.write_text(validator)

          final_workflow = subprocess.check_output(["git", "show", f"{os.environ['FINAL_WORKFLOW_SOURCE_COMMIT']}:{workflow_path}"])
          workflow_path.write_bytes(final_workflow)
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          expected = {str(lowering_path), str(validator_path), str(workflow_path)}
          if changed != expected:
              raise SystemExit("unexpected writeback paths:" + ",".join(sorted(changed ^ expected)))
          PY

          python -m compileall -q \
            hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tbgd/lowering.py \
            hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_a2_p0_action_window_status_callback_admission_finalization.py
          git diff --check
          /usr/bin/time -v python hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_a2_p0_action_window_status_callback_admission_finalization.py --fast
          /usr/bin/time -v python hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_a2_p0_action_window_status_callback_admission_finalization.py --direct

          remote_head="$(git ls-remote origin "refs/heads/${EXPECTED_BRANCH}" | cut -f1)"
          test "$remote_head" = "$current_head"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tbgd/lowering.py \
            hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_a2_p0_action_window_status_callback_admission_finalization.py \
            .github/workflows/p9-a2-p0-pr-validation.yml
          git diff --cached --check
          git commit -m "Implement A2-P0 status callback admission finalizer"
          git push origin "HEAD:refs/heads/${EXPECTED_BRANCH}"
