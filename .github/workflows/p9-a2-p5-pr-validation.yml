name: P9 A2 P5 direct validation

on:
  pull_request:
    paths:
      - ".github/workflows/p9-a2-p5-pr-validation.yml"
      - "hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tbgd/task_graph_materializer.py"
      - "hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tests/test_p9_a2_p5_process_only_settlement_barrier_retirement.py"
      - "hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_a2_p5_process_only_settlement_barrier_retirement.py"
      - "hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/docs/p9_execution_cards/P9-A2-P5_PROCESS_ONLY_SETTLEMENT_BARRIER_RETIREMENT.md"
      - "hsr_v075_baseline_clean/hsr/live_validation_reports/P9-A2-P5_PROCESS_ONLY_SETTLEMENT_BARRIER_RETIREMENT_execution_report.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p5-direct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Verify TBGD pin and compile P5 scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C turnbasedgamedata-main rev-parse HEAD)" = "14c1d18f91a8101d610e6c523447a7517de3fae1"
          python -m compileall -q \
            hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tbgd/task_graph_materializer.py \
            hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tests/test_p9_a2_p5_process_only_settlement_barrier_retirement.py \
            hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_a2_p5_process_only_settlement_barrier_retirement.py
      - name: Install focused test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --disable-pip-version-check pytest==8.3.5
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"
      - name: Run focused P5 and P3 Fast
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tests/test_p9_a2_p5_process_only_settlement_barrier_retirement.py -q
          python -m pytest hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tests/test_p9_a2_p3_wait_anim_state_process_only_barrier_retirement.py -q
      - name: Run A1 Fast and P5 Direct
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=hsr_v075_baseline_clean/hsr python -B -m simulator_v8_clean_core.tools.validate_p9_formal_action_graph_admission_authority --fast
          python hsr_v075_baseline_clean/hsr/simulator_v8_clean_core/tools/validate_p9_a2_p5_process_only_settlement_barrier_retirement.py --direct
      - name: Check fixed-base diff
        shell: bash
        run: git diff --check 8064d5ab01837d1ebb4d8388ca072796c7946634...HEAD
